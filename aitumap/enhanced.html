<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AITU Campus Map</title><style>
:root{--bg:#f4f7fa;--paper:#fff;--ink:#24303c;--muted:#64748b;--line:#dbe3ea;--blue:#2783de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.top{display:flex;align-items:center;gap:16px;padding:12px 22px;background:#fffffff2;border-bottom:1px solid var(--line)}.name b{display:block;font-size:16px}.name span{font-size:12px;color:var(--muted)}.search{flex:1;max-width:560px}.search input{width:100%;height:42px;border:1px solid #b8c5d1;border-radius:9px;padding:0 12px;font:inherit}.search input:focus{outline:3px solid #2783de33;border-color:var(--blue)}.switch,.floors{display:flex;gap:4px;padding:4px;background:#edf2f6;border-radius:9px}.switch button,.floors button{border:0;background:transparent;border-radius:6px;padding:8px 10px;color:#506070;font:600 13px system-ui;cursor:pointer}.switch button.active,.floors button.active{background:#fff;color:#126abc;box-shadow:0 1px 3px #0001}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line)}.helper{color:var(--muted);font-size:12px}.notice{display:none;margin:14px 22px 0;padding:10px 12px;background:#e7f2fc;border:1px solid #b9dbf3;border-radius:8px;color:#1e5e94}.notice.show{display:block}.maps{display:grid;gap:14px;padding:16px 22px;height:calc(100vh - 130px);min-height:420px}.maps.room{grid-template-columns:minmax(0,1fr);max-width:1280px;margin:auto}.maps.full{grid-template-columns:repeat(3,minmax(0,1fr))}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#fff}.card h2{position:absolute;z-index:2;top:9px;left:10px;margin:0;padding:4px 8px;background:#fffffff2;border-radius:6px;font-size:12px}.card iframe{display:block;width:100%;height:100%;border:0}@media(max-width:720px){body{overflow:auto}.top{flex-wrap:wrap;padding:12px 16px;gap:9px}.search{order:3;flex-basis:100%;max-width:none}.toolbar{padding:9px 16px;align-items:flex-start;gap:8px;flex-direction:column}.maps{height:calc(100vh - 194px);padding:14px 16px;min-height:380px}.maps.full{height:auto;grid-template-columns:1fr}.maps.full .card{height:420px}.notice{margin:12px 16px 0}}@media(prefers-color-scheme:dark){:root{--bg:#161b21;--paper:#20262d;--ink:#f6f8fa;--muted:#aab4bf;--line:#3a4550}.top,.toolbar,.card{background:#20262df2}.switch,.floors{background:#303a45}.switch button,.floors button{color:#cad2da}.switch button.active,.floors button.active{background:#20262d;color:#70b7fa}.search input{background:#171d23;color:var(--ink);border-color:#4a5663}.notice{background:#173653;border-color:#285a80;color:#c4e2ff}}
</style></head><body>
<header class="top"><div class="name"><b>AITU Campus Map</b><span>Блок C1 · кабинеты и помещения</span></div><label class="search"><input id="query" placeholder="Найти кабинет: C1.3.323K или 323K" autocomplete="off"></label><div class="switch"><button id="roomMode" class="active">Кабинет</button><button id="fullMode">Полная карта</button></div></header><div class="toolbar"><div class="floors"><button data-floor="1" class="active">1 этаж</button><button data-floor="2">2 этаж</button><button data-floor="3">3 этаж</button></div><span id="helper" class="helper">Введите номер кабинета или откройте полную карту.</span></div><div id="notice" class="notice"></div><main id="maps" class="maps room"></main>
<script>
const blocks=['C1.1','C1.2','C1.3'],maps=document.querySelector('#maps'),query=document.querySelector('#query'),notice=document.querySelector('#notice'),helper=document.querySelector('#helper');let floor=1,mode='room',room=new URLSearchParams(location.search).get('room')||'';
function parse(v){v=v.trim().toUpperCase().replace(/\s/g,'');let x=v.match(/^(?:C1\.)?([123])\.([\d]+[A-ZА-ЯЁ]*)$/);return x?{floor:+x[1],block:'C1.'+x[1],code:x[2],full:'C1.'+x[1]+'.'+x[2]}:null}
function setNative(d,el,value){let proto=el.tagName==='SELECT'?d.defaultView.HTMLSelectElement.prototype:d.defaultView.HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}))}
function configure(frame,block,term){try{const d=frame.contentDocument;if(!d)return;const select=d.querySelector('select'),input=d.querySelector('input');if(select)setNative(d,select,block);if(input)setNative(d,input,term);const hide=(seed)=>{let e=seed;while(e&&e!==d.body){let r=e.getBoundingClientRect();if(r.width>d.defaultView.innerWidth*.7&&r.height<110){e.style.display='none';return}e=e.parentElement}};hide(input);const title=[...d.querySelectorAll('*')].find(x=>(x.textContent||'').trim()==='aitu map');hide(title);const nums=[...d.querySelectorAll('button')].filter(x=>/^[123]$/.test(x.textContent.trim()));hide(nums[0])}catch(e){console.warn(e)}}
function panel(block,term){let c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+block+'</h2>';let f=document.createElement('iframe');f.title='Карта '+block+', этаж '+floor;f.src='index.html';f.onload=()=>setTimeout(()=>configure(f,block,term),140);c.append(f);return c}
function render(){let p=parse(room);if(p){floor=p.floor;query.value=p.full}let term=p?p.code:room.trim().toUpperCase();let list=mode==='full'?blocks:(p?[p.block]:(term?blocks:['C1.1']));maps.className='maps '+(mode==='full'?'full':'room');maps.replaceChildren(...list.map(b=>panel(b,term)));document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('active',+b.dataset.floor===floor));roomMode.classList.toggle('active',mode==='room');fullMode.classList.toggle('active',mode==='full');if(p){notice.textContent='Открыт '+p.full+' - кабинет подсвечен на плане '+p.block+'.';notice.classList.add('show');helper.textContent='Можно переключить этаж или открыть все блоки.'}else{notice.classList.remove('show');helper.textContent=mode==='full'?'Все блоки C1 на '+floor+' этаже.':'Введите полный номер кабинета для подсветки.'}}
let t;query.value=room;query.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{room=query.value;mode='room';render()},180)};roomMode.onclick=()=>{mode='room';render()};fullMode.onclick=()=>{mode='full';room='';query.value='';render()};document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{floor=+b.dataset.floor;room='';query.value='';render()});render();
</script></body></html>
